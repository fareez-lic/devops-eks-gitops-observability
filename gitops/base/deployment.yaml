apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-observability-demo
  namespace: gitops-demo
  labels:
    app.kubernetes.io/name: gitops-observability-demo
    app.kubernetes.io/part-of: devops-eks-gitops-observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gitops-observability-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitops-observability-demo
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/fareez-lic/gitops-observability-demo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
